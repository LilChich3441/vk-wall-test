<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка доступа к стене</title>
<style>
:root{--bg:#fff;--text:#222;--muted:#818c99;--line:#e7e8ec;--accent:#2688eb}
@media (prefers-color-scheme:dark){:root{--bg:#19191a;--text:#e1e3e6;--muted:#939393;--line:#363738;--accent:#529ef4}}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font-size:18px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);width:180px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:rgba(127,127,127,.12);padding:10px;border-radius:8px;font-size:13px;max-height:50vh;overflow:auto}
.muted{color:var(--muted);font-size:13px}
</style></head><body>
<h1>Проверка: даёт ли ВК мини-приложению право на стену</h1>
<p class="muted">Только для теста на своей тестовой группе. Ключ никуда не отправляется, хранится только в этой вкладке.</p>
<div class="row"><label>ID приложения <input id="app" value="54897590"></label>
<button id="ask">1. Запросить доступ wall</button></div>
<div class="row"><label>ID группы (цифры) <input id="gid" placeholder="например 123456"></label>
<button id="read">2. Прочитать 3 поста</button></div>
<div class="row"><label>Номер поста <input id="pid" placeholder="только тестовый!"></label>
<button id="del">3. Удалить этот пост</button></div>
<pre id="out">Нажмите 1.</pre>
<script src="https://unpkg.com/@vkontakte/vk-bridge@2.15.11/dist/browser.min.js"></script>
<script>
const bridge = window.vkBridge;
const out = document.getElementById("out");
let token = "", scope = "";
const log = (t, o) => { out.textContent = t + (o === undefined ? "" : "\n" + JSON.stringify(o, null, 2)); };
bridge.send("VKWebAppInit").catch(e => log("Не удалось подключиться к ВК (страницу нужно открыть внутри ВК)", e));
document.getElementById("ask").onclick = async () => {
  try {
    const r = await bridge.send("VKWebAppGetAuthToken", { app_id: +document.getElementById("app").value, scope: "wall,groups" });
    token = r.access_token; scope = r.scope;
    log("Ответ ВК. Выданные права (scope): " + JSON.stringify(scope) + (String(scope).includes("wall") ? "\nПраво wall ВЫДАНО" : "\nПраво wall НЕ выдано"));
  } catch (e) { log("ВК отказал в выдаче ключа", e); }
};
async function api(method, params) {
  return bridge.send("VKWebAppCallAPIMethod", { method, params: Object.assign({ v: "5.199", access_token: token }, params) });
}
document.getElementById("read").onclick = async () => {
  if (!token) return log("Сначала шаг 1");
  try {
    const r = await api("wall.get", { owner_id: -Math.abs(+document.getElementById("gid").value), count: 3 });
    log("wall.get работает. Посты:", (r.response.items || []).map(p => ({ id: p.id, text: (p.text || "").slice(0, 80) })));
  } catch (e) { log("wall.get не сработал", e); }
};
document.getElementById("del").onclick = async () => {
  if (!token) return log("Сначала шаг 1");
  const gid = Math.abs(+document.getElementById("gid").value), pid = +document.getElementById("pid").value;
  if (!gid || !pid) return log("Укажите группу и номер тестового поста");
  const b = document.getElementById("del");
  if (b.dataset.sure !== pid + "_" + gid) { b.dataset.sure = pid + "_" + gid; b.textContent = "Точно удалить пост " + pid + "? Нажмите ещё раз"; return; }
  b.dataset.sure = ""; b.textContent = "3. Удалить этот пост";
  try {
    const r = await api("wall.delete", { owner_id: -gid, post_id: pid });
    log("wall.delete ответил:", r);
  } catch (e) { log("wall.delete не сработал (это и есть ответ на вопрос)", e); }
};
</script></body></html>
